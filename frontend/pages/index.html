<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Complexity Analyzer">
    <title>Login - Complexity Analyzer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body> <!-- Login and Registration Container -->
    <div class="login-container">
        <!-- Login View -->
        <div id="loginView">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Enter your details to access the Complexity Analyzer.</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-actions">
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>
            
            <div class="register-prompt">
                <p>Don't have an account? <a href="#" id="showRegisterBtn">Register here</a></p>
            </div>
        </div>

        <!-- Register View -->
        <div id="registerView" style="display: none;">
            <div class="login-header">
                <h1>Create an Account</h1>
                <p>Sign up to start analyzing complexities.</p>
            </div>
            
            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <label for="regName">Username</label>
                    <input type="text" id="regName" name="name" placeholder="Kurticles" required>
                </div>

                <div class="input-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login" id="registerSubmitBtn">Register</button>
            </form>
            
            <div class="register-prompt">
                <p>Already have an account? <a href="#" id="showLoginBtn">Sign In</a></p>
            </div>
        </div>
    </div>

    <script src="../scripts/login.js"></script>
</body>
</html>
