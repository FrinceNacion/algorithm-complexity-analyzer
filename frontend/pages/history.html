<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complexity Analyzer - History</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f8f9fa;
      /* from-slate-50 to-slate-100 equivalent */
      min-height: 100vh;
    }

    .navbar {
      background-color: white;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    .nav-link.active-link {
      background-color: #eff6ff;
      /* blue-50 */
      color: #1d4ed8;
      /* blue-700 */
      border-radius: 0.5rem;
    }

    .nav-link {
      color: #475569;
      /* slate-600 */
      border-radius: 0.5rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .nav-link:hover:not(.active-link) {
      background-color: #f1f5f9;
      /* slate-100 */
    }

    .icon-primary {
      color: #2563eb;
      /* blue-600 */
    }

    .card {
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      background-color: white;
      margin-bottom: 1.5rem;
    }
  </style>
</head>

<body>

  <!-- Root Layout Navbar -->
  <nav class="navbar navbar-expand-lg px-3 px-sm-4 px-lg-5">
    <div class="container-fluid max-w-7xl">
      <a class="navbar-brand d-flex align-items-center" href="main.html">
        <i data-lucide="activity" class="icon-primary" style="width: 32px; height: 32px;"></i>
        <span class="ms-2 fs-5 fw-semibold text-dark">Algorithm Analyzer</span>
      </a>
      <div class="d-flex align-items-center gap-1">
        <a href="main.html" class="nav-link d-flex align-items-center py-2 px-3 text-decoration-none">
          <i data-lucide="activity" style="width: 16px; height: 16px; margin-right: 8px;"></i>
          Analyzer
        </a>
        <a href="history.html" class="nav-link active-link d-flex align-items-center py-2 px-3 text-decoration-none">
          <i data-lucide="history" style="width: 16px; height: 16px; margin-right: 8px;"></i>
          History
        </a>
        <a href="#" id="profileIconBtn" class="nav-link d-flex align-items-center py-2 px-3 text-decoration-none">
          <i data-lucide="user" style="width: 16px; height: 16px; margin-right: 8px;"></i>
          Profile
        </a>
      </div>
    </div>
  </nav>

  <!-- Main View (History) -->
  <main class="container py-4 max-w-7xl">

    <div id="emptyState" class="card d-none">
      <div class="card-body py-5 text-center text-muted">
        <i data-lucide="clock" style="width: 48px; height: 48px;" class="mx-auto mb-3 text-light-subtle"></i>
        <p class="fs-5 mb-0">No analysis history yet</p>
        <p class="small mt-2">Run some algorithms from the Analyzer to see results here</p>
      </div>
    </div>

    <div id="historyContent" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 fw-bold text-dark mb-1">Analysis History</h1>
          <p class="text-secondary mb-0">View all past algorithm analysis results</p>
        </div>
        <div class="d-flex gap-2">
            <button id="exportCsvBtn" class="btn btn-outline-success d-flex align-items-center gap-2">
                <i data-lucide="file-spreadsheet" style="width: 16px; height: 16px;"></i>
                Export CSV
            </button>
            <button id="exportPdfBtn" class="btn btn-outline-danger d-flex align-items-center gap-2">
                <i data-lucide="file-text" style="width: 16px; height: 16px;"></i>
                Export PDF
            </button>
            <button id="clearHistoryBtn" class="btn btn-danger d-flex align-items-center gap-2">
              <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
              Clear History
            </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
          <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3">
            <h5 class="card-title fw-bold mb-0" id="historyTitle">Recent Analyses</h5>
            <div style="width: 100%; max-width: 250px;">
              <select id="algorithmFilter" class="form-select">
                <option value="all">All Algorithms</option>
                <!-- Optgroups injected via JS -->
              </select>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div id="noResults" class="text-center text-secondary py-5 d-none">
            <p>No results match your filters</p>
          </div>

          <div id="tableContainer" class="table-responsive d-none">
            <table class="table table-hover align-middle mb-0">
              <thead class="border-bottom text-muted">
                <tr>
                  <th scope="col" class="cursor-pointer" data-sort="algorithm">
                    <div class="d-flex align-items-center gap-1">
                      Algorithm <i data-lucide="arrow-up-down" class="sort-icon d-none"
                        style="width: 12px; height: 12px;"></i>
                    </div>
                  </th>
                  <th scope="col" class="text-center cursor-pointer" data-sort="size">
                    <div class="d-flex align-items-center justify-content-center gap-1">
                      <i data-lucide="hash" style="width: 16px; height: 16px;"></i>
                      Input Size <i data-lucide="arrow-up-down" class="sort-icon d-none"
                        style="width: 12px; height: 12px;"></i>
                    </div>
                  </th>
                  <th scope="col" class="text-center cursor-pointer" data-sort="time">
                    <div class="d-flex align-items-center justify-content-center gap-1">
                      <i data-lucide="clock" style="width: 16px; height: 16px;"></i>
                      Execution Time <i data-lucide="arrow-up-down" class="sort-icon d-none"
                        style="width: 12px; height: 12px;"></i>
                    </div>
                  </th>
                  <th scope="col" class="text-center cursor-pointer" data-sort="memory">
                    <div class="d-flex align-items-center justify-content-center gap-1">
                      <i data-lucide="hard-drive" style="width: 16px; height: 16px;"></i>
                      Memory <i data-lucide="arrow-up-down" class="sort-icon d-none"
                        style="width: 12px; height: 12px;"></i>
                    </div>
                  </th>
                  <th scope="col" class="text-center cursor-pointer" data-sort="date">
                    <div class="d-flex align-items-center justify-content-center gap-1">
                      <i data-lucide="calendar" style="width: 16px; height: 16px;"></i>
                      Date <i data-lucide="arrow-up-down" class="sort-icon d-none"
                        style="width: 12px; height: 12px;"></i>
                    </div>
                  </th>
                  <th scope="col" class="text-center">Action</th>
                </tr>
              </thead>
              <tbody id="historyTableBody" class="border-top-0">
                <!-- Rows injected via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- jsPDF and AutoTable for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <script type="module" src="../scripts/history.js"></script>
  <script>
    // Initialize icons that are not dynamically injected
    lucide.createIcons();
  </script>
</body>

</html>
