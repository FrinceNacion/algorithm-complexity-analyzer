<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Algorithm Complexity Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
    <style>
        .verify-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .verify-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.75rem;
        }
        .icon-wrap.loading { background: #eff6ff; }
        .icon-wrap.success { background: #f0fdf4; }
        .icon-wrap.error   { background: #fff1f2; }
        .verify-card h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.5rem; color: #0f172a; }
        .verify-card p  { color: #64748b; font-size: 0.92rem; line-height: 1.6; }
        .btn-verify {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.65rem 1.5rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-verify:hover { background: #1d4ed8; }
        .btn-resend {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.6rem 1.4rem;
            background: transparent;
            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-resend:hover { background: #eff6ff; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #bfdbfe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="verify-card" id="verifyCard">
            <!-- State: Loading -->
            <div id="stateLoading">
                <div class="icon-wrap loading">
                    <div class="spinner"></div>
                </div>
                <h1>Verifying your email…</h1>
                <p>Please wait while we confirm your email address.</p>
            </div>

            <!-- State: Success (hidden initially) -->
            <div id="stateSuccess" style="display:none;">
                <div class="icon-wrap success">✅</div>
                <h1>Email Verified!</h1>
                <p>Your email address has been successfully verified. You can now sign in to your account.</p>
                <a href="index.html" class="btn-verify">Sign In</a>
            </div>

            <!-- State: Error (hidden initially) -->
            <div id="stateError" style="display:none;">
                <div class="icon-wrap error">❌</div>
                <h1>Verification Failed</h1>
                <p id="errorMessage">The link is invalid or has expired.</p>
                <a href="index.html" class="btn-verify">Back to Sign In</a>
                <br>
                <button class="btn-resend" id="resendFromVerifyBtn">Resend Verification Email</button>
            </div>
        </div>
    </div>

    <script>
        const VERIFY_ENDPOINT  = 'http://localhost/algorithm-complexity-analyzer/backend/verify_email.php';
        const RESEND_ENDPOINT  = 'http://localhost/algorithm-complexity-analyzer/backend/resend_verification.php';

        const params = new URLSearchParams(window.location.search);
        const token  = params.get('token');

        async function verifyToken() {
            if (!token) {
                showError('No verification token was found in the link.');
                return;
            }

            try {
                const res  = await fetch(`${VERIFY_ENDPOINT}?token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (data.success) {
                    showSuccess();
                } else {
                    showError(data.error || 'Verification failed. Please try again.');
                }
            } catch (e) {
                showError('A network error occurred. Please check your connection and try again.');
            }
        }

        function showSuccess() {
            document.getElementById('stateLoading').style.display = 'none';
            document.getElementById('stateSuccess').style.display = 'block';
        }

        function showError(msg) {
            document.getElementById('stateLoading').style.display = 'none';
            document.getElementById('errorMessage').textContent = msg;
            document.getElementById('stateError').style.display = 'block';
        }

        // Resend button — prompts for email and calls the resend endpoint
        document.getElementById('resendFromVerifyBtn').addEventListener('click', async () => {
            const email = prompt('Enter the email address you registered with:');
            if (!email) return;

            const btn = document.getElementById('resendFromVerifyBtn');
            btn.disabled = true;
            btn.textContent = 'Sending…';

            try {
                const res  = await fetch(RESEND_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message || data.error || 'Done.');
            } catch (e) {
                alert('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Resend Verification Email';
            }
        });

        // Run on page load
        verifyToken();
    </script>
</body>
</html>
