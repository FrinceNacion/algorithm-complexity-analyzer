<!DOCTYPE html>
<html>

<head>
    <title>Complexity Analyzer</title>
    <link rel="stylesheet" href="../styles/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg px-3 px-sm-4 px-lg-5">
        <div class="container-fluid max-w-7xl">
            <a class="navbar-brand d-flex align-items-center" href="main.html">
                <i data-lucide="activity" class="icon-primary" style="width: 32px; height: 32px;"></i>
                <span class="ms-2 fs-5 fw-semibold text-dark">Algorithm Analyzer</span>
            </a>
            <div class="d-flex align-items-center gap-1">
                <a href="main.html"
                    class="nav-link active-link d-flex align-items-center py-2 px-3 text-decoration-none">
                    <i data-lucide="activity" style="width: 16px; height: 16px; margin-right: 8px;"></i>
                    Analyzer
                </a>
                <a href="pages/history.html" class="nav-link d-flex align-items-center py-2 px-3 text-decoration-none">
                    <i data-lucide="history" style="width: 16px; height: 16px; margin-right: 8px;"></i>
                    History
                </a>
            </div>
        </div>
    </nav>
    <div class="page-shell">
        <div class="app-card">
            <div class="app-card__header">
                <h1>Algorithm Complexity Analyzer</h1>
                <p>Choose an algorithm, enter the input size, and run to see the result.</p>
            </div>

            <div class="app-card__body">
                <div class="input-group">
                    <label for="algorithm">Algorithm</label>
                    <select id="algorithm">
                        <option value="bubble">Bubble Sort</option>
                        <option value="merge">Merge Sort</option>
                        <option value="binary_search">Binary Search</option>
                        <option value="linear_search">Linear Search</option>
                        <option value="fibonacci_recursive">Fibonacci (Recursive)</option>
                        <option value="fibonacci_dynamic_programming">Fibonacci (Dynamic Programming)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="size">Input Size / N</label>
                    <input type="number" id="size" placeholder="Enter a number" min="10">
                </div>

                <button class="btn-primary" id="runBtn">Run</button>

                <div class="result-card" id="result-card">
                    <h2>Result</h2>
                    <p id="result">No result yet.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../scripts/algorithms.js"></script>
    <script type="module" src="../scripts/script.js"></script>
    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>

</html>
